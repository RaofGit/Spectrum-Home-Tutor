    <meta charset="UTF-8">

    <title>Thank You - Spectrum Home Tutor</title>
    
<link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Specific Styles for Thank You Page */
        .thankyou-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-light);
            padding: 20px;
            text-align: center;
        }
        .thankyou-card {
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            max-width: 550px;
            border-top: 5px solid var(--accent-color);
        }
        .thankyou-card i {
            font-size: 60px;
            color: #25d366;
            margin-bottom: 20px;
        }
        .thankyou-card h1 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: 700;
        }
        .thankyou-card p {
            color: #555;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .back-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
        }
        .back-btn:hover {
            background-color: var(--secondary-color);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="thankyou-wrapper">
        <div class="thankyou-card">
            <i class="fas fa-check-circle"></i>
            <h1>Request Received!</h1>
            <p>Shukriya! Aapki 3-Days free demo class ki request receive ho gayi hai. Hamari team jald hi aap se raabta karegi taake aapke required area mein best tutor final kiya ja sake.</p>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
        </div>
    </div>

</body>
</html>
